services:
  postgres:
    image: postgres:16-alpine
    container_name: learning-analytics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learning_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-learning_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learning_password}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-learning_user} -d ${POSTGRES_DB:-learning_analytics}
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: learning-analytics-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Learning Analytics API}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-learning_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-learning_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learning_password}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-8}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      ANALYTICS_WORKER_INTERVAL_SECONDS: ${ANALYTICS_WORKER_INTERVAL_SECONDS:-1}
      ANALYTICS_WORKER_BATCH_SIZE: ${ANALYTICS_WORKER_BATCH_SIZE:-100}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learning-analytics-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
